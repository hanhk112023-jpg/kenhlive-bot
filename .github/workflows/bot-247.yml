name: KenhLive Bot 24/7 (FreeDeepseekAPI)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *' # Backup watchdog mỗi 4 tiếng phòng trường hợp runner đứt đoạn
  push:
    branches: [main]

concurrency:
  group: kenhlive-telegram-bot-runner
  cancel-in-progress: true

jobs:
  run-bot:
    name: 🤖 KenhLive AI Bot 24/7
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 📥 Tải mã nguồn Bot
        uses: actions/checkout@v4

      - name: 🐍 Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🟢 Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Cài đặt & Khởi động FreeDeepseekAPI (Local Proxy)
        run: |
          echo "Cloning FreeDeepseekAPI..."
          git clone https://github.com/dekrezz/FreeDeepseekAPI.git FreeDeepseekAPI
          cd FreeDeepseekAPI
          if [ -n "${{ secrets.DEEPSEEK_AUTH_JSON }}" ]; then
            echo '${{ secrets.DEEPSEEK_AUTH_JSON }}' > deepseek-auth.json
            echo "Starting FreeDeepseekAPI server in background..."
            NON_INTERACTIVE=1 node server.js &
            sleep 4
          else
            echo "Notice: DEEPSEEK_AUTH_JSON secret is not configured yet."
          fi

      - name: 🚀 Khởi chạy Bot Telegram với DeepSeek AI & Tự Động Nối Tiếp (330 Phút)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_BASE_URL: "http://127.0.0.1:9655/v1"
          DEEPSEEK_MODEL: "deepseek-v4-flash"
          GH_PAT: ${{ secrets.GH_PAT }}
          RUN_DURATION_MINUTES: 330
        run: |
          python3 bot.py

      - name: 🔄 Kích hoạt Runner Nối Tiếp (Fallback Relay)
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 -c "
          import os, urllib.request, json
          token = os.environ.get('GH_PAT', '').strip()
          repo = os.environ.get('GITHUB_REPOSITORY', 'hanhk112023-jpg/kenhlive-bot')
          if not token: exit(0)
          url = f'https://api.github.com/repos/{repo}/actions/workflows/bot-247.yml/dispatches'
          req = urllib.request.Request(
              url,
              data=json.dumps({'ref': 'main'}).encode('utf-8'),
              headers={'Accept': 'application/vnd.github.v3+json', 'Authorization': f'token {token}', 'User-Agent': 'KenhLiveRelay'}
          )
          try:
              urllib.request.urlopen(req, timeout=15)
              print('Fallback relay dispatched successfully.')
          except Exception as e:
              print('Relay notice:', e)
          "
